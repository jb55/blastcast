[package]
name = "blastcast-airplay-out"
description = "AirPlay 1 (RAOP) output: a native sender, bridged into Sendspin groups"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blastcast-mdns.workspace = true
blastcast-telemetry = { workspace = true, features = ["hub"] }
blastcast-sendspin.workspace = true

blastcast.workspace = true
bytes.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
getrandom.workspace = true
if-addrs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
blastcast-audio.workspace = true
blastcast-sendspin = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
