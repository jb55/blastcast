[package]
name = "blastcast-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# AirPlay in, Sendspin out, on blastcast alone: a phone plays to every
# connected Sendspin player as one group.
[dependencies]
anyhow.workspace = true
blastcast.workspace = true
blastcast-airplay.workspace = true
blastcast-mdns.workspace = true
blastcast-sendspin.workspace = true
blastcast-telemetry.workspace = true
bytes.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# tests/relay.rs: a RAOP sender as the phone.
blastcast-airplay-out.workspace = true
blastcast-sendspin = { workspace = true, features = ["testing"] }
futures-channel.workspace = true
futures-util.workspace = true
tempfile.workspace = true

[lints]
workspace = true
