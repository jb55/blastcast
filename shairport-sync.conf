// shairport-sync configuration for one tune-assistant-server AirPlay
// receiver, filled in by tas-airplay (config.rs) for each target. Adapted
// from Music Assistant's airplay_receiver template.
//
// Every {NAME} is replaced once; values are already escaped for a
// double-quoted libconfig string.

general =
{
	name = "{AIRPLAY_NAME}";
	// The speakers do the volume: shairport passes the stream through
	// untouched and reports the phone's volume as `pvol` metadata.
	ignore_volume_control = "yes";
	output_backend = "pipe";
	default_airplay_volume = {DEFAULT_VOLUME};
	port = {PORT};
{INTERFACE_LINE}};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	pipe_name = "{METADATA_PIPE}";
	pipe_timeout = 0;  // never give up on the pipe; tas holds it open
};

pipe =
{
	name = "{AUDIO_PIPE}";
};

// Play start and stop markers, written into the metadata pipe beside the
// metadata items, rather than parsed out of shairport's log.
sessioncontrol =
{
	run_this_before_entering_active_state = "/bin/sh -c 'echo {PLAY_BEGIN} > {METADATA_PIPE}'";
	run_this_after_exiting_active_state = "/bin/sh -c 'echo {PLAY_END} > {METADATA_PIPE}'";
	active_state_timeout = 10.0;  // seconds of silence before playback has ended
	wait_for_completion = "no";
};
