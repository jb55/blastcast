[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jb55/blastcast"
publish = false

[workspace.dependencies]
blastcast = { path = "crates/blastcast" }

async-trait = "0.1"
thiserror = "2"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
