[package]
name = "blastcast"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One timeline across every audio protocol: clock maps, anchors, timed sources and a rate match"
repository = "https://github.com/jb55/blastcast"
publish = false

# It knows no protocol and no server: protocol code depends on blastcast,
# never the reverse.
[dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
